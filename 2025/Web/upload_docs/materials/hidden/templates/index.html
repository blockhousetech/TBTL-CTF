<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EUDI Wallet Link Submissions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #005bbb;
            margin-bottom: 10px;
        }

        p.description {
            margin-top: 0;
            font-size: 1rem;
            color: #555;
        }

        form {
            margin-top: 20px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        button {
            background-color: #005bbb;
            color: white;
            padding: 10px 18px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004999;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            margin: 8px 0;
        }

        a {
            color: #0077cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Submit EUDI Wallet Project Links</h1>
        <p class="description">
            Please submit useful links related to <strong>EUDI Wallet</strong> projects along with your name or username.
        </p>

        <form method="post">
            <input type="text" name="username" placeholder="TBTL" required>
            <input type="url" name="link" placeholder="https://fortid.com" required>
            <button type="submit">Submit Link</button>
        </form>

        <h2>Submitted Links</h2>
        <ul id='links'>
            {% for entry in links %}
                <li><strong name="{{loop.index0}}">{{entry.username}}</strong> – <a data-index="{{loop.index0}}" href="{{entry.link}}" target="_blank" >{{entry.link}}</a></li>
            {% endfor %}
        </ul>

        <div class="footer">
            Submissions are cleared every minute.
        </div>
    </div>
