<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Name Counts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f172a; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .bg-animated {
      background: radial-gradient(1000px 800px at 10% 10%, #1e293b 0%, transparent 50%),
                  radial-gradient(900px 700px at 90% 20%, #0ea5e9 0%, transparent 45%),
                  radial-gradient(900px 700px at 20% 90%, #22c55e 0%, transparent 45%),
                  linear-gradient(180deg, #0b1220 0%, #0b1220 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .input {
      width: 100%;
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      padding: 0.75rem 1rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      font-weight: 600;
      background: linear-gradient(135deg, #38bdf8, #22c55e);
      color: #0b1220;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      background: rgba(255,255,255,0.1);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body class="bg-animated text-white">
  <main class="min-h-full flex items-center justify-center p-4">
    <div class="w-full max-w-3xl">
      <section class="glass rounded-3xl p-8 md:p-10 shadow-xl">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="badge mb-3">Baby Names</div>
            <h1 class="text-3xl md:text-4xl font-extrabold leading-tight">Find the count for a baby name by year</h1>
            <p class="mt-3 text-white/70 max-w-prose">Type a name and a year to see how many babies were registered with that name in that year.</p>
          </div>
        </div>

        <form class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4">
          <div>
            <label for="name" class="block text-sm font-medium text-white/80 mb-1">Name</label>
            <input id="name" name="name" type="text" placeholder="e.g., Olivia" class="input" required />
          </div>
          <div>
            <label for="year" class="block text-sm font-medium text-white/80 mb-1">Year</label>
            <input id="year" name="year" type="number" placeholder="e.g., 2015" class="input" required />
          </div>
          <div class="flex items-end">
            <button type="submit" class="btn-primary w-full">Get Count</button>
          </div>
        </form>

        <!-- Example static result card -->
        <div class="mt-8">
          <div class="glass rounded-2xl p-6">
            <h2 class="text-xl font-bold">Results</h2>
            {% if error is not none %}
              <p class="mt-2 text-white/80">{{ error }}</p>
            {% else %}
              <p class="mt-2 text-white/80">In <span class="font-semibold">{{year}}</span>, the name <span class="font-semibold">{{name}}</span> appeared <span class="font-extrabold">{{count}}</span> time(s).</p>
            {% endif %}
            </div>
        </div>
      </section>
      <footer class="text-center text-white/50 text-sm mt-6">
        Powered by FortID
      </footer>
    </div>
  </main>
</body>
</html>
